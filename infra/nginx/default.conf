# TazaTokri Production Edge Reverse Proxy & Rate Limiting (Nginx)
# Requires TLS certificates mounted at /etc/nginx/certs/fullchain.pem and privkey.pem.
# Certificate renewal webroot mounted at /var/www/certbot.

# ==============================================================================
# Rate-Limiting Zones (http context, keyed by $binary_remote_addr TCP peer IP)
# ==============================================================================
# 1. Authentication endpoints (/api/auth/login, /signup, /register):
#    Strict brute-force & credential-stuffing protection (5 req/min + burst 5).
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# 2. Customer order & payment initiation/verification endpoints:
#    Protects checkout & payment flows while allowing normal polling (30 req/min + burst 15).
limit_req_zone $binary_remote_addr zone=customer_order_payment_limit:10m rate=30r/m;

# 3. Public catalog endpoints (/api/public/vegetables, /api/public/combos):
#    Mitigates catalog scraping without impacting normal browsing (60 req/min + burst 20).
limit_req_zone $binary_remote_addr zone=public_catalog_limit:10m rate=60r/m;

# 4. Razorpay webhook endpoint (/api/payments/razorpay/webhook):
#    Generous ceiling so legitimate Razorpay retries/bursts are never blocked (120 req/min + burst 60).
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=120r/m;

# 5. General authenticated API endpoints (/api/...):
#    Baseline abuse protection for staff, delivery, basket, and report routes (120 req/min + burst 30).
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=120r/m;

# Return HTTP 429 Too Many Requests instead of default 503 when rate limit is exceeded
limit_req_status 429;

# Safe access log format: uses $uri (omits query strings), includes duration and X-Correlation-Id
log_format tazatokri_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                          'status=$status bytes=$body_bytes_sent rt=$request_time '
                          'urt="$upstream_response_time" corrId="$sent_http_x_correlation_id"';

access_log /var/log/nginx/access.log tazatokri_safe;
error_log  /var/log/nginx/error.log warn;

# ==============================================================================
# Trusted Proxy Note:
# Nginx is the direct edge listener, so $binary_remote_addr is the true client
# TCP peer IP and cannot be spoofed via client-supplied X-Forwarded-For headers.
# If placing Cloudflare / AWS ALB in front of Nginx later, configure:
#   set_real_ip_from <TRUSTED_PROXY_CIDR>;
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Internal-only container healthcheck endpoint (localhost only, no HTTPS redirect)
    location = /nginx-health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Let's Encrypt ACME HTTP-01 challenge for zero-downtime certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # TLS Certificates (mounted via Docker volume; never committed to Git)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern TLS 1.2 & 1.3 Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    # CSP in Report-Only mode first (style-src 'unsafe-inline' required by React/Radix/Tailwind inline styles; no unsafe-eval or inline scripts)
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    # Enable HSTS ONLY after verifying your production domain and valid TLS certificate:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Support 5MB Proof-of-Delivery / Invoice uploads + multipart overhead
    client_max_body_size 10m;

    # Hide Nginx version
    server_tokens off;

    # Custom JSON 429 response (uncached, matches GlobalExceptionHandler envelope)
    # Note: Nginx drops server-level add_header directives inside any location using add_header,
    # so all baseline security headers are repeated here explicitly.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        return 429 '{"message":"Too many requests. Please try again shortly."}';
    }

    # 1. Authentication endpoints (/api/auth/login, /api/auth/signup, /api/auth/register)
    location ~ ^/api/auth/(login|signup|register)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 2. Razorpay Webhook endpoint (signature-verified + idempotent; generous retry allowance)
    location = /api/payments/razorpay/webhook {
        limit_req zone=webhook_limit burst=60 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 3. Customer Order & Online Payment endpoints (/api/customer/orders...)
    location ^~ /api/customer/orders {
        limit_req zone=customer_order_payment_limit burst=15 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 4. Public Catalog endpoints (/api/public/vegetables, /api/public/combos)
    location ^~ /api/public/ {
        limit_req zone=public_catalog_limit burst=20 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 5. All other backend API calls (staff, delivery, addresses, baskets, reports, ops)
    location /api/ {
        limit_req zone=api_general_limit burst=30 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Public liveness/readiness health endpoints (unthrottled for orchestrator/LB probes)
    location ~ ^/actuator/health(/liveness|/readiness)?$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block all other actuator endpoints at the edge
    location /actuator/ {
        return 404;
    }

    # Serve React + Vite PWA static assets with SPA fallback (not rate-limited)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
