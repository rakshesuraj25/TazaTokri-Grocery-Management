# Isolated test properties — prevents tests from ever touching the real tazatokri MySQL database
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=jdbc:mysql://localhost:3306/tazatokri_test_isolated_disabled
spring.datasource.username=test_isolated
spring.datasource.password=test_isolated
spring.flyway.password=test_flyway_password
app.jwt.secret=test-isolated-jwt-secret-for-tests-only-must-be-32bytes-long
app.bootstrap.owner-password=TestOwner@123
