# Isolated test properties — prevents tests from ever touching the real tazatokri MySQL database by default
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=jdbc:mysql://localhost:3306/tazatokri_test_isolated_disabled
spring.datasource.username=test_isolated
spring.datasource.password=test_isolated
spring.flyway.password=test_flyway_password

# --- JWT ---
app.jwt.secret=test-isolated-jwt-secret-for-tests-only-must-be-32bytes-long
app.jwt.expiration-minutes=60

# --- First owner bootstrap ---
app.bootstrap.owner-name=TazaTokri Owner
app.bootstrap.owner-phone=9999999999
app.bootstrap.owner-password=TestOwner@123

# --- Pricing ---
app.pricing.lookback-days=3
app.pricing.wastage-percent=5
app.pricing.margin-percent=20
app.pricing.rounding-step=1

# --- Delivery and orders ---
app.delivery.pincodes=411026,411039
app.delivery.min-order=150
app.delivery.fee=30
app.delivery.cutoff-time=18:00
app.delivery.free-above=300

app.order.payment-hold-minutes=15
app.order.max-over-percent=20
app.order.expiry-grace-minutes=2

# --- Razorpay ---
app.razorpay.key-id=test_razorpay_key
app.razorpay.key-secret=test_razorpay_secret
app.razorpay.webhook-secret=test_webhook_secret

# --- Scheduled jobs ---
app.jobs.enabled=false

# --- WhatsApp Business Cloud API ---
app.whatsapp.enabled=false
app.whatsapp.phone-number-id=
app.whatsapp.access-token=
app.whatsapp.business-account-id=
app.whatsapp.api-version=v21.0
app.whatsapp.webhook-verify-token=
app.whatsapp.shop-support-phone=9999999999

# --- Gemini AI Assistant ---
app.gemini.enabled=false
app.gemini.api-key=
app.gemini.model=gemini-4-hydrogen
app.gemini.max-upload-bytes=5242880

# --- Phase 4 Delivery OTP, POD, Storage ---
app.delivery.otp.ttl-minutes=30
app.delivery.otp.max-attempts=5
app.delivery.pod.max-upload-bytes=5242880
app.delivery.pod.require-photo=false

app.storage.provider=LOCAL
app.storage.local-dir=./data/private-uploads-test

app.sentry.dsn=
app.sentry.environment=test
app.sentry.traces-sample-rate=0.0

app.backup.status-file=./data/backups/backup-status-test.json
app.cors.allowed-origins=http://localhost:5173
app.version=0.4.0
