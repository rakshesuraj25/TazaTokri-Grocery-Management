# ===================================================================
# Production Profile (Active with spring.profiles.active=prod)
# Hardened Configuration: Zero Fallback Defaults for Sensitive Secrets
# ===================================================================

# Database credentials MUST be passed via environment variables
spring.datasource.password=${DB_APP_PASSWORD}
spring.flyway.password=${DB_PASSWORD}

# Security credentials MUST be passed via environment variables
app.jwt.secret=${JWT_SECRET}
app.bootstrap.owner-password=${BOOTSTRAP_OWNER_PASSWORD}

# Restrictive CORS configured strictly from environment variable
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# JPA & Performance Hardening
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Actuator: Exposure strictly limited to health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Reverse Proxy / Forwarded Headers (accepted from internal trusted Docker proxy)
server.forward-headers-strategy=framework
