spring.application.name=tazatokri

# Default to dev profile unless SPRING_PROFILES_ACTIVE is specified
spring.profiles.default=dev

# --- Database connection ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tazatokri?serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tazatokri_app}
spring.datasource.password=${DB_APP_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.user=${SPRING_FLYWAY_USER:root}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- Server ---
server.port=8080

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# --- First owner bootstrap (used only if no OWNER exists) ---
app.bootstrap.owner-name=${BOOTSTRAP_OWNER_NAME:TazaTokri Owner}
app.bootstrap.owner-phone=${BOOTSTRAP_OWNER_PHONE:9999999999}
app.bootstrap.owner-password=${BOOTSTRAP_OWNER_PASSWORD}

# --- Pricing ---
app.pricing.lookback-days=3
app.pricing.wastage-percent=5
app.pricing.margin-percent=20
app.pricing.rounding-step=1

# --- Delivery and orders ---
app.delivery.pincodes=411026,411039
app.delivery.min-order=150
app.delivery.fee=30
app.delivery.cutoff-time=18:00
app.delivery.free-above=300

app.order.payment-hold-minutes=15
app.order.max-over-percent=20

# --- Razorpay ---
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# --- Scheduled jobs ---
app.jobs.enabled=true
app.order.expiry-grace-minutes=2

# --- WhatsApp Business Cloud API (Optional Stage 2; disabled by default) ---
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID:}
app.whatsapp.api-version=${WHATSAPP_API_VERSION:v21.0}
app.whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
app.whatsapp.shop-support-phone=${WHATSAPP_SHOP_SUPPORT_PHONE:9999999999}

# --- Gemini AI Assistant (Optional Phase 3; disabled by default) ---
app.gemini.enabled=${GEMINI_ENABLED:false}
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-4-hydrogen}
app.gemini.max-upload-bytes=${GEMINI_MAX_UPLOAD_BYTES:5242880}

# --- Phase 4: Delivery OTP, Proof of Delivery, Storage, Monitoring & Backups ---
app.delivery.otp.ttl-minutes=${DELIVERY_OTP_TTL_MINUTES:30}
app.delivery.otp.max-attempts=${DELIVERY_OTP_MAX_ATTEMPTS:5}
app.delivery.pod.max-upload-bytes=${DELIVERY_POD_MAX_UPLOAD_BYTES:5242880}
app.delivery.pod.require-photo=${DELIVERY_POD_REQUIRE_PHOTO:false}

app.storage.provider=${STORAGE_PROVIDER:LOCAL}
app.storage.local-dir=${STORAGE_LOCAL_DIR:./data/private-uploads}
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.region=${S3_REGION:auto}
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}

app.sentry.dsn=${SENTRY_DSN:}
app.sentry.environment=${SENTRY_ENVIRONMENT:development}
app.sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}

app.backup.status-file=${BACKUP_STATUS_FILE:./data/backups/backup-status.json}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.version=${APP_VERSION:0.4.0}
