
spring.application.name=tazatokri

# --- Database connection ---
spring.datasource.url=jdbc:mysql://localhost:3306/tazatokri?serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=tazatokri_app
spring.datasource.password=${DB_APP_PASSWORD:choose-a-long-password}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.user=root
spring.flyway.password=${DB_PASSWORD:root}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- Server ---
server.port=8080

# --- JWT ---
app.jwt.secret=${JWT_SECRET:tazatokri-dev-secret-change-me-in-production-0123456789}
app.jwt.expiration-minutes=60

# --- First owner bootstrap (used only if no OWNER exists) ---
app.bootstrap.owner-name=${BOOTSTRAP_OWNER_NAME:TazaTokri Owner}
app.bootstrap.owner-phone=${BOOTSTRAP_OWNER_PHONE:9999999999}
app.bootstrap.owner-password=${BOOTSTRAP_OWNER_PASSWORD:Owner@123}

# --- Pricing ---
app.pricing.lookback-days=3
app.pricing.wastage-percent=5
app.pricing.margin-percent=20
app.pricing.rounding-step=1

# --- Delivery and orders ---
app.delivery.pincodes=411026,411039
app.delivery.min-order=150
app.delivery.fee=30
app.delivery.cutoff-time=18:00
app.delivery.free-above=300

app.order.payment-hold-minutes=15
app.order.max-over-percent=20

# --- Razorpay ---
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# --- Scheduled jobs ---
app.jobs.enabled=true
app.order.expiry-grace-minutes=2
