# ===================================================================
# Development Profile (Active with spring.profiles.active=dev)
# Secrets must be provided via environment variables or a gitignored .env file.
# ===================================================================

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tazatokri_dev?serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.password=${DB_APP_PASSWORD}
spring.flyway.user=${SPRING_FLYWAY_USER:tazatokri_app}
spring.flyway.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.bootstrap.owner-password=${BOOTSTRAP_OWNER_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
spring.jpa.show-sql=true
