name: TazaTokri Full-Stack CI

on:
  push:
    branches: [qa-tidb]
  pull_request:
    branches: [qa-tidb]

jobs:
  frontend:
    name: Frontend Typecheck, Lint, Unit Tests, Image Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Verify 36/36 studio vegetable photographs
        run: npm run check:images

      - name: Run Vitest unit & integration tests
        run: npm test

      - name: Build production PWA bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test --project=chromium

  backend:
    name: Backend Maven Compile & JUnit Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Maven compilation and JUnit test suites
        run: chmod +x mvnw && ./mvnw test
