services:
  mysql:
    image: mysql:8.4
    container_name: tazatokri-mysql
    restart: unless-stopped
    command: --default-time-zone='+05:30'
    environment:
      TZ: Asia/Kolkata
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-tazatokri}
      MYSQL_USER: ${DB_APP_USER:-tazatokri_app}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD}
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - tazatokri-internal

  backend:
    image: tazatokri-backend:${APP_VERSION:-0.4.0}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tazatokri-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      TZ: Asia/Kolkata
      APP_VERSION: ${APP_VERSION:-0.4.0}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-tazatokri}?serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${DB_APP_USER:-tazatokri_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      SPRING_FLYWAY_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BOOTSTRAP_OWNER_NAME: ${BOOTSTRAP_OWNER_NAME:-TazaTokri Owner}
      BOOTSTRAP_OWNER_PHONE: ${BOOTSTRAP_OWNER_PHONE:-9999999999}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-LOCAL}
      STORAGE_LOCAL_DIR: /app/data/private-uploads
      APP_BACKUP_DIR: /app/data/backups
      BACKUP_STATUS_FILE: /app/data/backup-status/backup-status.json
    volumes:
      - ./backend/data/private-uploads:/app/data/private-uploads
      - ./backend/data/backups:/app/data/backups
      - ./backend/data/backup-status:/app/data/backup-status:ro
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - tazatokri-internal

  frontend:
    image: tazatokri-frontend:${APP_VERSION:-0.4.0}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: tazatokri-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
      - ./infra/certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=32m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - tazatokri-internal

volumes:
  mysql_data:

networks:
  tazatokri-internal:
    driver: bridge
