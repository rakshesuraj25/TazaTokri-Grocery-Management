services:
  mysql:
    image: mysql:8.4
    container_name: tazatokri-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tazatokri
      MYSQL_USER: tazatokri_app
      MYSQL_PASSWORD: choose-a-long-password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: tazatokri-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
